; PlatformIO Project Configuration File
;
; ESWCap — STM32G474 port
; Hardware: WeAct Studio STM32G474CEU6 "Long" core board
;           (STM32G474CEU6, UFQFPN48, Cortex-M4F @ 170 MHz, 512 KB flash, 128 KB RAM)
;
; Firmware framework: STM32Cube HAL/LL (no Arduino, no RTOS obligation).
; Upload/debug path:  USB DFU bootloader (BOOT0 + NRST), via dfu-util.
;
; Docs: https://docs.platformio.org/page/projectconf.html
; Board: https://github.com/WeActStudio/WeActStudio.STM32G474CoreBoard

[platformio]
; Keep it obvious where the firmware lives.
src_dir = src
include_dir = include
lib_dir = lib
test_dir = test
default_envs = weact_g474ceu6


; ---------------------------------------------------------------------------
; Shared settings for every environment
; ---------------------------------------------------------------------------
[env]
platform = ststm32@~20.0.0
framework = stm32cube

; Provided by the ST `ststm32` platform: "WeAct Studio STM32G474 CoreBoard".
; Selected per-environment below so a future bare-MCU env can reuse this block.

; Console / telemetry UART. USART1 = PA9 (TX) / PA10 (RX) on this board.
; TX-only is usually enough for the @@EVT telemetry stream, but the console
; accepts commands, so wire RX as well and keep monitor_rts/dtr at 0 so the
; serial adapter does not reset or hold the target.
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

; Keep the build honest: warnings loudly. -Wall -Wextra catch the usual
; embedded foot-guns (sign compare, unused vars, missing prototypes).
; -ffunction-sections/-fdata-sections plus the default --gc-sections let the
; linker drop unused HAL modules.
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -ffunction-sections
    -fdata-sections
    ; The WeAct board fits an 8 MHz HSE crystal. The clock tree
    ; (HSE 8 MHz -> PLL -> 170 MHz SYSCLK / 48 MHz USB) is configured in
    ; firmware; HSE_VALUE must match so the PLL maths is right.
    -DHSE_VALUE=8000000U
    ; STM32Cube links with --specs=nano.specs, whose newlib variant omits
    ; floating-point support in printf by default. The @@EVT telemetry is full
    ; of %g fields and the console prints engineering units, so pull the float
    ; formatter in explicitly. Costs ~7 KB of flash.
    -Wl,-u,_printf_float

; Run the standard library's own tests via: pio test -e weact_g474ceu6
test_framework = unity


; ---------------------------------------------------------------------------
; Primary environment — the physical WEACT G474 long board
; ---------------------------------------------------------------------------
[env:weact_g474ceu6]
board = weact_g474ceu6

; --- Upload: USB DFU bootloader -------------------------------------------
; Enter DFU mode by holding BOOT0 and tapping NRST, then release BOOT0.
; The board enumerates as ST's ROM bootloader (0483:DF11) and dfu-util takes
; over from there; PlatformIO adds the DFU suffix to firmware.bin for us.
upload_protocol = dfu
; upload_port is not used for DFU (it matches on VID:PID, not a tty).

; --- Debug ---------------------------------------------------------------
; DFU cannot debug. Debugging needs an SWD probe (ST-Link / Black Magic /
; CMSIS-DAP) wired to PA13 (SWDIO) / PA14 (SWCLK) / NRST / GND / 3V3.
; The `debug` env below is preconfigured for that path.
debug_tool = stlink
debug_init_break = tbreak main


; ---------------------------------------------------------------------------
; Optional environment — ST-Link / SWD, for real debugging
; ---------------------------------------------------------------------------
; Identical firmware, but builds the debug-friendly variant and uploads over
; SWD instead of DFU. Use when a probe is attached:
;     pio run -e weact_g474ceu6_debug -t upload
;     pio debug  -e weact_g474ceu6_debug
[env:weact_g474ceu6_debug]
extends = env:weact_g474ceu6
build_type = debug
build_flags =
    ${env:weact_g474ceu6.build_flags}
    -DDEBUG
    -DUSE_FULL_ASSERT
upload_protocol = stlink
debug_tool = stlink


; ---------------------------------------------------------------------------
; Optional environment — ST-Link / SWD release upload
; ---------------------------------------------------------------------------
; Same optimized firmware as the primary env, but flashed through an SWD probe
; rather than the DFU bootloader. Handy when the board is already wired to a
; probe on the bench.
[env:weact_g474ceu6_stlink]
extends = env:weact_g474ceu6
upload_protocol = stlink

; ---------------------------------------------------------------------------
; Combined C + R environment — requires the rev 2 front end
; ---------------------------------------------------------------------------
; Same firmware as the primary env, but compiles in the R-mode analog path:
; Q1, the LMC6482 A/B, the K1/K2 relays, the second MAX4619 and OPAMP3. Only
; use this once those parts are fitted; on a C-mode-only board `mode r` would
; energise relay coils that do not exist.
;
;     pio run -e weact_g474ceu6_combined
[env:weact_g474ceu6_combined]
extends = env:weact_g474ceu6
build_flags =
    ${env:weact_g474ceu6.build_flags}
    -DESWCAP_HAS_RMODE=1
